name: Map quality
on: [push, pull_request]
jobs:
  offline-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.txt
      - run: .venv/bin/ruff format --check src tests scripts/check-integration.py scripts/check-expanded.py scripts/acquire-expanded.py scripts/acquire-terrain.py
      - run: .venv/bin/ruff check src tests scripts/check-integration.py scripts/check-expanded.py scripts/acquire-expanded.py scripts/acquire-terrain.py
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: ./scripts/sthlm build --offline
      - run: ./scripts/sthlm validate
      - run: ./scripts/sthlm build --offline --output .cache/rebuild
      - run: diff dist/stockholm/checksums.json .cache/rebuild/stockholm/checksums.json
